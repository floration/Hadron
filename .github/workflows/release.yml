name: Release

# Push a tag vX.Y.Z on a commit that is on main, or run this workflow by hand on main with a version
# (Actions > Release > Run workflow); the second way creates the tag on main's head. This builds the exes with that version in their
# VERSIONINFO and publishes them with a SHA256SUMS file. The in-app updater (core/sys/update.cpp) reads
# the latest release, matches the asset by exe name, checks SHA256SUMS and the VERSIONINFO, then swaps
# the exe in.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z (the tag vX.Y.Z is created on main's head)"
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve tag
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::run the release workflow on main"; exit 1; }
            TAG="v${INPUT_VERSION#v}"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          # Validate before anything reaches GITHUB_ENV (a newline in the input would define extra variables).
          [[ "$TAG" =~ ^v(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})$ ]] || { echo "::error::tag must be vX.Y.Z"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # fetch-depth: 0 fetched every tag; a local check can't fail open on a network error.
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then echo "::error::$TAG already exists"; exit 1; fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Tag must be vX.Y.Z on main
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})$ ]] || { echo "::error::tag must be vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tagged commit is not on main"; exit 1; }
          IFS=. read -r a b c <<< "${TAG#v}"
          for n in $a $b $c; do (( n <= 65535 )) || { echo "::error::version fields must be <= 65535"; exit 1; }; done
      # The full CI (incl. the Windows job with the BIOS selftests) must have passed on this exact commit.
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          [ "${ok:-0}" -gt 0 ] || { echo "::error::no successful CI run for $GITHUB_SHA"; exit 1; }
      - name: Install toolchain
        run: |
          for i in 1 2 3; do sudo apt-get update && break; sleep 15; done
          sudo apt-get install -y mingw-w64 cmake ninja-build wine64
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release -DHADRON_VERSION="${TAG#v}"
          cmake --build build
      # Nothing is published that fails its own selftests: users install the latest release automatically.
      - name: Selftests (Wine)
        run: |
          export WINEDEBUG=-all WINEPREFIX="$PWD/.wine"
          wineboot -i || true
          wine build/Hadron.exe --selftest-update
          wine build/HadronDiskMap.exe --selftest
          wine build/HadronRunAs.exe --selftest
          wine build/Hadron.exe --solo runas --selftest
      - name: Package
        run: |
          mkdir dist
          cp build/Hadron.exe build/HadronBios.exe build/HadronDiskMap.exe build/HadronRunAs.exe build/HadronServices.exe dist/
          (cd dist && sha256sum *.exe > SHA256SUMS && cat SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The commit the remote tag points at (peeled, so annotated tags compare as their commit; "" if none).
          remote_commit() { git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n1 | cut -f1; }
          # Right before publishing: the tag must be absent (manual run) or on this commit (tag push), so a tag
          # pushed meanwhile on another commit never gets this build attached.
          pre=$(remote_commit) || { echo "::error::can't read the remote tag"; exit 1; }
          if [ -n "$pre" ] && [ "$pre" != "$GITHUB_SHA" ]; then echo "::error::$TAG points at $pre, not $GITHUB_SHA"; exit 1; fi
          # --target only matters when the tag doesn't exist yet (manual run): it is created on this commit.
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Hadron ${TAG#v}" --generate-notes
          # And after, for the remaining race. A failed release is deleted; its tag is left alone, since it may be
          # someone else's: if this run created it, delete it by hand before re-running the same version.
          got=$(remote_commit || true)
          if [ "$got" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG points at ${got:-nothing}, not $GITHUB_SHA; deleting the release"
            gh release delete "$TAG" --yes || true
            exit 1
          fi

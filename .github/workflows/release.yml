name: Release

# Push a tag vX.Y.Z on a commit that is on main. This builds the exes with that version in their
# VERSIONINFO and publishes them with a SHA256SUMS file. The in-app updater (core/sys/update.cpp) reads
# the latest release, matches the asset by exe name, checks SHA256SUMS and the VERSIONINFO, then swaps
# the exe in.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be vX.Y.Z on main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::tag must be vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tagged commit is not on main"; exit 1; }
          IFS=. read -r a b c <<< "${GITHUB_REF_NAME#v}"
          for n in $a $b $c; do (( n <= 65535 )) || { echo "::error::version fields must be <= 65535"; exit 1; }; done
      # The full CI (incl. the Windows job with the BIOS selftests) must have passed on this exact commit.
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          [ "${ok:-0}" -gt 0 ] || { echo "::error::no successful CI run for $GITHUB_SHA"; exit 1; }
      - name: Install toolchain
        run: |
          for i in 1 2 3; do sudo apt-get update && break; sleep 15; done
          sudo apt-get install -y mingw-w64 cmake ninja-build wine64
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release -DHADRON_VERSION="${GITHUB_REF_NAME#v}"
          cmake --build build
      # Nothing is published that fails its own selftests: users install the latest release automatically.
      - name: Selftests (Wine)
        run: |
          export WINEDEBUG=-all WINEPREFIX="$PWD/.wine"
          wineboot -i || true
          wine build/Hadron.exe --selftest-update
          wine build/HadronDiskMap.exe --selftest
          wine build/HadronRunAs.exe --selftest
          wine build/Hadron.exe --solo runas --selftest
      - name: Package
        run: |
          mkdir dist
          cp build/Hadron.exe build/HadronBios.exe build/HadronDiskMap.exe build/HadronRunAs.exe build/HadronServices.exe dist/
          (cd dist && sha256sum *.exe > SHA256SUMS && cat SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Hadron ${GITHUB_REF_NAME#v}" --generate-notes
